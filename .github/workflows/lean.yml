name: Lean 4 Verification & Build

on:
  push:
    branches: [ main, master, "feature/**", "integration/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.numtide.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Toolchain comes from ci/flake.nix: lean4-nix's readToolchainFile pins
      # exactly minimal/lean-toolchain (4.28.0), served from cache.numtide.com.
      # The whole gate lives in ci/build.sh so devs run the identical script.
      - name: Build + verify (no-mathlib lake build, then gokujo check)
        run: nix develop --no-write-lock-file ./ci --command bash ci/build.sh

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gokujo-report
          path: gokujo-report.json
          retention-days: 7

      - name: Test Lean 4 compiler compatibility
        run: nix develop --no-write-lock-file ./ci --command bash -c 'lean --version && leanc --version && lake --version'

  # pipelight.dev integration (separate job for clarity)
  pipelight:
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v20

      - name: Install pipelight CLI
        run: |
          curl -fsSL https://pipelight.dev/install.sh | sh
          export PATH="$HOME/.pipelight/bin:$PATH"

      - name: Build with pipelight.dev
        run: |
          pipelight build --manifest pipelight.yml --artifact lean-worker

      - name: Deploy to pipelight.dev CDN
        if: success()
        run: |
          pipelight deploy --artifact lean-worker --channel stable
        env:
          PIPELIGHT_TOKEN: ${{ secrets.PIPELIGHT_TOKEN }}
