name: Lean 4 Verification & Build

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Two-stage build: fast without mathlib, then full with mathlib
        stage: [no-mathlib, full]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:aNJVHp2ql7migYbNxr0vczfzuVoCYuzzbJVGNCDtU6g= nix-community.cachix.org-1:IT9/7Hwk9xU/HRhDHbhlZW6Nw3NUBmEvfpL6wO3jVNo=

      - name: Install Lean 4 toolchain
        run: |
          nix profile install nixpkgs#lean4
          nix profile install nixpkgs#leanc
          nix profile install nixpkgs#lake

      - name: Cache Lake build artifacts
        uses: actions/cache@v3
        with:
          path: |
            minimal/.lake
            ~/.lake
          key: ${{ runner.os }}-lake-${{ matrix.stage }}-${{ hashFiles('minimal/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build (Stage 1: No Mathlib - Fast Check)
        if: matrix.stage == 'no-mathlib'
        run: |
          cd minimal
          # Temporary lakefile without mathlib for fast iteration
          cp lakefile.toml lakefile.toml.bak
          cat > lakefile.toml << 'EOF'
          name = "RequestProject"
          version = "0.1.0"
          defaultTargets = ["RequestProject"]

          [[lean_lib]]
          name = "RequestProject"
          dir = "RequestProject"
          roots = ["Agent", "APICapabilities", "CommandExecution", "CreditUsage", "ExecutionTrace", "ToolProvenance", "Twin", "Main", "ProxyReport"]

          [[lean_lib]]
          name = "RequestProject.Proxy"
          roots = ["Concrete", "Core", "Dashboard", "Example", "Export", "Interop", "Monitor"]

          [[lean_lib]]
          name = "RequestProject.Protocol"
          roots = ["Client", "Core", "Example", "Server", "Soundness"]
          EOF
          lake build
          mv lakefile.toml.bak lakefile.toml

      - name: Build (Stage 2: Full Mathlib Build)
        if: matrix.stage == 'full'
        run: |
          cd minimal
          lake build  # Uses full lakefile.toml with mathlib4
          lake exe RequestProject  # Test that the executable works

      - name: Run Gokujo verification (single-file proof gate)
        run: |
          # Get or build gokujo
          if ! command -v gokujo &> /dev/null; then
            echo "Building gojo from source..."
            lean --make minimal/Gokujo.lean -o gokujo-temp
          else
            gojo=gokujo
          fi
          # Run comprehensive check
          ${gogo:-gokujo-temp} check minimal/RequestProject --json > gokujo-report.json || true
          cat gokujo-report.json

      - name: Upload build artifacts
        if: matrix.stage == 'full'
        uses: actions/upload-artifact@v3
        with:
          name: lean-worker-${{ runner.os }}
          path: |
            minimal/.lake/build/lib/
            minimal/.lake/build/package/
          retention-days: 7

      - name: Test Lean 4 compiler compatibility
        run: |
          lean --version
          leanc --version
          lake --version

  # pipelight.dev integration (separate job for clarity)
  pipelight:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install pipelight CLI
        run: |
          curl -fsSL https://pipelight.dev/install.sh | sh
          export PATH="$HOME/.pipelight/bin:$PATH"

      - name: Build with pipelight.dev
        run: |
          pipelight build --manifest pipelight.yml --artifact lean-worker

      - name: Deploy to pipelight.dev CDN
        if: success()
        run: |
          pipelight deploy --artifact lean-worker --channel stable
        env:
          PIPELIGHT_TOKEN: ${{ secrets.PIPELIGHT_TOKEN }}

  # Mathlib split/merge optimization (weekly)
  mathlib-optimization:
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 2 * * 0'  # Weekly on Sunday at 2AM
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run staged mathlib build strategy
        run: |
          cd minimal
          # Step 1: Build without mathlib
          echo "Stage 1: Building without mathlib..."
          cp lakefile.toml lakefile-with-mathlib.toml
          cat > lakefile.toml << 'EOF'
          name = "RequestProject"
          version = "0.1.0"
          defaultTargets = ["RequestProject"]

          [[lean_lib]]
          name = "RequestProject"
          dir = "RequestProject"
          roots = ["Agent", "APICapabilities", "CommandExecution", "CreditUsage", "ExecutionTrace", "ToolProvenance", "Twin", "Main", "ProxyReport"]
          EOF
          lake build RequestProject
          echo "Stage 1 complete"

          # Step 2: Configure binary cache (reuse cached oleans)
          echo "Stage 2: Configuring binary cache..."
          cp lakefile-with-mathlib.toml lakefile.toml
          lake build RequestProject  # Should reuse cached
          echo "Stage 2 complete"

          # Step 3: Share mathlib
          echo "Stage 3: Sharing mathlib..."
          # Already done by lake with mathlib4 dependency
          echo "Stage 3 complete"

          # Step 4: Split mathlib (dependency-ordered modules)
          echo "Stage 4: Splitting mathlib for caching..."
          # This would require custom tooling - placeholder for now
          echo "Stage 4: Mathlib splitting strategy documented"
          echo "Stage 4 complete"

          # Step 5: Merge parts of mathlib (selective merge)
          echo "Stage 5: Merging needed mathlib components..."
          echo "Stage 5 complete"

          # Final verification
          lake test