name: Solve Git Twin

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/solve_git_twin.mjs'
      - '.github/workflows/solve_git_twin.yml'
      - 'minimal/**'
      - 'tools/gokujo/**'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/solve_git_twin.mjs'
      - '.github/workflows/solve_git_twin.yml'
      - 'minimal/**'
      - 'tools/gokujo/**'
      - '.github/workflows/lean.yml'
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC — keep the twin report fresh

jobs:
  solve-git-twin:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: main
      RELAY: https://kant-zk-relay.jmikedupont2.workers.dev
      RELAY_ROOM: agent-zoo-public
      SALT: twin-proof-wave-vi-xii-2026-09-17-mike
      NODE_ID: github-actions-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://cache.numtide.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # Same gate lean.yml runs: lean4-nix pins the toolchain from
      # minimal/lean-toolchain; without nix the runner has no `lean` at all
      # (this was the 0-second failure class).
      - name: Verify the Lean twin (the same gate lean.yml runs)
        run: nix develop --no-write-lock-file ./ci --command bash ci/build.sh

      - name: Solve the git twin end to end
        run: |
          node .github/workflows/solve_git_twin.mjs

      - name: Publish the twin report
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node -e "
          const p = require('./.github/workflows/solve_git_twin.mjs');
          p.postToRelay({ kind: 'solve_git_twin_status', status: 'published', run: Number(process.env.RUN_ID), node: process.env.NODE_ID, ts: Date.now() });
          "
