name = "otc-desk-relay-v2"
main = "worker.js"
compatibility_date = "2024-11-06"

# One Durable Object per room. This is the binding the prototype never had,
# and the reason every request used to see an empty room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
INVITE_REQUIRED = "true"
GAS_LIMIT_PER_PEER_PER_HOUR = "1000000"
MAX_LINE = "262144"
MAX_LINES = "4096"
ROOM_TTL_MS = "21600000"
GAS_COST_PER_MESSAGE = "1000"
GAS_COST_PER_BYTE = "1"