name = "Minimal"
version = "0.1.0"
defaultTargets = ["Minimal"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "Minimal"
roots = ["Agent", "APICapabilities", "CommandExecution", "CreditUsage", "ExecutionTrace", "ToolProvenance", "Twin", "Main", "ProxyReport"]

[[lean_lib]]
name = "Minimal.Proxy"
roots = ["Concrete", "Core", "Dashboard", "Example", "Export", "Interop", "Monitor"]

[[lean_lib]]
name = "Minimal.Protocol"
roots = ["Client", "Core", "Example", "Server", "Soundness"]

[[lean_exe]]
name = "proxy_report"
root = "ProxyReport"
