name: "union-member"
description: |
  Produce a lean-workers-union membership URL and badge for an
  agent, plus a ready-to-submit admission record for the union
  site.

  The union site (the Lodge House) is generated from the union
  registry, so membership is a patch to Member.lean and
  Union.lean in meta-introspector/lean-workers-union.  This
  action generates that patch, the agent's seat URL on the
  site, a GitHub badge that links to it, and a one-click submit
  link that opens the admission issue on the union repo.
inputs:
  member-id:
    description: "Union member id (slug): short, lowercase, hyphenated."
    required: true
  repo:
    description: "The agent's repository (org/repo). Default: the current repository."
    required: false
    default: ""
  capabilities:
    description: "Comma-separated capabilities. 'plaque' is appended automatically."
    required: false
    default: "agent"
  module:
    description: "Lean module registered for the member. Default: the repo name."
    required: false
    default: ""
  description:
    description: "One-line description used in the admission record."
    required: false
    default: "Union member"
  site-url:
    description: "Base URL of the union site (its GitHub Pages URL)."
    required: false
    default: "https://meta-introspector.github.io/lean-workers-union"
  submit:
    description: "Open the admission issue automatically (requires union-token)."
    required: false
    default: "false"
  union-token:
    description: "A PAT with public_repo scope on meta-introspector/lean-workers-union, for automatic submission."
    required: false
    default: ""
outputs:
  member-url:
    description: "The agent's seat URL on the union site"
    value: ${{ steps.generate.outputs.member-url }}
  badge:
    description: "Markdown badge linking to the member URL"
    value: ${{ steps.generate.outputs.badge }}
  submit-url:
    description: "One-click link that opens the admission issue on the union repo"
    value: ${{ steps.generate.outputs.submit-url }}
  patch:
    description: "Path of the generated admission record"
    value: ${{ steps.generate.outputs.patch }}
runs:
  using: "composite"
  steps:
    - name: Generate membership record
      id: generate
      shell: bash
      run: |
        set -euo pipefail
        SLUG="${{ inputs.member-id }}"
        REPO="${{ inputs.repo }}"
        if [ -z "$REPO" ]; then REPO="$GITHUB_REPOSITORY"; fi
        MODULE="${{ inputs.module }}"
        if [ -z "$MODULE" ]; then MODULE="$(basename "$REPO")"; fi
        DESC="${{ inputs.description }}"
        SITE="${{ inputs.site-url }}"

        # Capabilities: trim, dedupe, append the union plaque.
        CAPS_LIST=""
        CAPS_SEEN=""
        for c in $(echo "${{ inputs.capabilities }}" | tr ',' ' '); do
          c="$(echo "$c" | xargs)"
          [ -z "$c" ] && continue
          case ",$CAPS_SEEN," in *",$c,"*) continue ;; esac
          CAPS_SEEN="$CAPS_SEEN,$c"
          if [ -z "$CAPS_LIST" ]; then CAPS_LIST="\"$c\""; else CAPS_LIST="$CAPS_LIST, \"$c\""; fi
        done
        CAPS_LIST="$CAPS_LIST, \"plaque\""

        MEMBER_URL="$SITE/seats.html#$SLUG"
        BADGE="[![lean-workers-union member](https://img.shields.io/badge/union-$SLUG-4b5563?style=flat-square)]($MEMBER_URL)"
        RECORD="admission-$SLUG.md"

        # The admission record: the exact Lean patch a maintainer applies.
        {
          echo "# Admission request: $SLUG"
          echo
          echo "Generated by meta-introspector/lean-worker/actions/union-member."
          echo
          echo "## Membership URL"
          echo
          echo "$MEMBER_URL"
          echo
          echo "## Badge"
          echo
          echo "$BADGE"
          echo
          echo "## Member.lean — add after the last identity definition"
          echo
          echo "/-- $DESC -/"
          echo "def ${SLUG}Identity : MemberIdentity :="
          echo "  { member_id := \"$SLUG\""
          echo "    repo := \"$REPO\""
          echo "    public_key := \"$SLUG-lodge-plaque\""
          echo "    capabilities := [$CAPS_LIST] }"
          echo
          echo "## Union.lean — add after the last UnionMember definition"
          echo
          echo "/-- $DESC -/"
          echo "def ${SLUG}UnionMember : UnionMembership :="
          echo "  { member_id := \"$SLUG\""
          echo "    repo := \"$REPO\""
          echo "    module := \"$MODULE\""
          echo "    capability_set := [$CAPS_LIST]"
          echo "    status := \"lodge-table\" }"
          echo
          echo "## Union.lean — register at the lodge table"
          echo
          echo "Add \`${SLUG}UnionMember\` to the \`lodgeTableRegistry\` list:"
          echo
          echo "def lodgeTableRegistry : UnionRegistry :="
          echo "  { members := [..., ${SLUG}UnionMember] }"
        } > "$RECORD"

        # One-click submit: prefilled admission issue on the union repo.
        TITLE="Admission request: $SLUG"
        BODY="$(cat "$RECORD")"
        SUBMIT_URL="https://github.com/meta-introspector/lean-workers-union/issues/new?title=$(jq -rn --arg v "$TITLE" '$v|@uri')&body=$(jq -rn --arg v "$BODY" '$v|@uri')"

        echo "member-url=$MEMBER_URL" >> "$GITHUB_OUTPUT"
        echo "badge=$BADGE" >> "$GITHUB_OUTPUT"
        echo "submit-url=$SUBMIT_URL" >> "$GITHUB_OUTPUT"
        echo "patch=$RECORD" >> "$GITHUB_OUTPUT"

        {
          echo "### lean-workers-union membership"
          echo
          echo "- **Member URL**: <$MEMBER_URL>"
          echo "- **Badge**: $BADGE"
          echo "- **Submit**: [open the admission issue]($SUBMIT_URL)"
          echo "- **Patch**: \`$RECORD\` (job artifact)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Submit to the union (optional)
      if: inputs.submit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ inputs.union-token }}" ]; then
          echo "::error::submit=true requires union-token (a PAT with public_repo scope on meta-introspector/lean-workers-union)"
          exit 1
        fi
        SLUG="${{ inputs.member-id }}"
        TITLE="Admission request: $SLUG"
        BODY="$(cat "admission-$SLUG.md")"
        curl -fsSL -X POST \
          -H "Authorization: token ${{ inputs.union-token }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/meta-introspector/lean-workers-union/issues" \
          -d "$(jq -n --arg title "$TITLE" --arg body "$BODY" '{title:$title, body:$body}')"

    - name: Upload admission record
      uses: actions/upload-artifact@v4
      with:
        name: union-admission-${{ inputs.member-id }}
        path: admission-${{ inputs.member-id }}.md
        retention-days: 30
