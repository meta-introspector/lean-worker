# pipelight.dev build manifest for lean-worker
# See https://pipelight.dev/docs for full reference

pipelines:
  lean-worker:
    steps:
      - name: stage1-fast
        description: Fast iteration build (no mathlib)
        duration: ~5s
        commands:
          - nix profile install nixpkgs#lean4
          - nix profile install nixpkgs#leanc
          - nix profile install nixpkgs#lake
          - cd minimal
          - cp lakefile.toml lakefile.toml.bak
          - |
            cat > lakefile.toml << 'EOF'
            name = "RequestProject"
            version = "0.1.0"
            defaultTargets = ["RequestProject"]

            [[lean_lib]]
            name = "RequestProject"
            dir = "RequestProject"
            roots = ["Agent", "APICapabilities", "CommandExecution", "CreditUsage", "ExecutionTrace", "ToolProvenance", "Twin", "Main", "ProxyReport"]

            [[lean_lib]]
            name = "RequestProject.Proxy"
            roots = ["Concrete", "Core", "Dashboard", "Example", "Export", "Interop", "Monitor"]

            [[lean_lib]]
            name = "RequestProject.Protocol"
            roots = ["Client", "Core", "Example", "Server", "Soundness"]
            EOF
          - lake build
          - mv lakefile.toml.bak lakefile.toml
      - name: stage2-full
        description: Full build with mathlib
        duration: ~30s
        needs: [stage1-fast]
        commands:
          - cd minimal
          - lake build
          - lake test
      - name: stage3-gokujo
        description: Gokujo verification gate
        duration: ~10s
        needs: [stage2-full]
        commands:
          - |
            if [ ! -x minimal/gokujo ]; then
              echo "Building gokujo from source..."
              (
                cd minimal
                LEAN_PATH=. lean -o Gokujo.olean -c Gokujo.c Gokujo.lean
                LEAN_PATH=. lean -c GokujoMain.c GokujoMain.lean
                leanc -o gokujo Gokujo.c GokujoMain.c
                chmod +x gokujo
              )
            fi
          - cd minimal && ./gokujo check RequestProject --json

artifacts:
  paths:
    - minimal/.lake/build/lib/
    - minimal/.lake/build/package/
  expire_in: 7d

deploy:
  provider: pipelight.dev
  channel: stable
  token: ${PIPELIGHT_TOKEN}
  commands:
    - pipelight deploy --artifact lean-worker --channel stable